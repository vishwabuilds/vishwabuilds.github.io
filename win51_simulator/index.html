<script>

else if(k=='L'){const d=x-(at+r.len);if(d<-128||d>127)bad='Relative jump out of range';e.push(d&255)}

function dis(a,m=M){const o=m[a],d=DIS[o];if(!d)return{len:1,b:[o],t:'DB '+hx(o,2)};

function step(){const p=pc,o=M[p],L=DIS[o]?DIS[o].len:1,f=i=>M[(p+i)&65535];pc=(p+L)&65535;CYC+=ccy(o);

else if(o==0x72)setc(cy()|gb(f(1)));else if(o==0xA0)setc(cy()|!gb(f(1)));else if(o==0x82)setc(cy()&gb(f(1)));else if(o==0xB0)setc(cy()&!gb(f(1)));

function go(){clearInterval(timer);TR=[];CYC=0;PC8={ctl:0,cfg:0,warn:0};sbm('Program running...  (press the red light to halt)');

/* ---------- windows ---------- */
const W={};let z=10;
function win(id,t,x,y,body,init){if(W[id]){W[id].style.zIndex=++z;return}
const e=document.createElement('div');e.className='w';e.style.cssText=`left:${x}px;top:${y}px;z-index:${++z}`;

$('#mdi').append(e);W[id]=e;$('.x',e).onclick=()=>{e.remove();delete W[id]};

gr:sv('<rect x="2" y="4" width="28" height="24" fill="#111" stroke="#666" stroke-width="2"/><path d="M5 16h22M16 7v18" stroke="#2a5a2a" stroke-width="1"/><path d="M5 23h5v-10h6v10h6v-10h5" stroke="#5f5" stroke-width="2" fill="none" shape-rendering="crispEdges"/>'),
rst:sv('<path d="M26 16a10 10 0 1 1-3.5-7.6" fill="none" stroke="#d22" stroke-width="3.5" stroke-linecap="round"/><polygon points="27,3 28,13 18,11" fill="#d22"/>'+base('RESET')),
go:lt(2),halt:lt(0),
help:sv('<path d="M5 6l16-3 6 4v20l-16 4-6-4z" fill="#7a3fa0" stroke="#2a1040" stroke-width="1.4"/><path d="M5 6l6 4v20" fill="none" stroke="#2a1040"/><path d="M11 10l16-3" stroke="#e8c0f0" stroke-width="1.5"/><path d="M14 27l11-8" stroke="#d33" stroke-width="3"/>')};
const TB=['up','dn','reg','dis','asm','P','X','I','gr','rst','step','run','cmd','go','halt','help'];
$('#tb').innerHTML=TB.map(k=>`<button title="${ACT[k][0]}" data-k="${k}"${k=='asm'?' class=asm':''}>${ICO[k]}</button>`).join('');
$('#tb').onclick=ev=>{const b=ev.target.closest('button');if(b)ACT[b.dataset.k][1]()};
const MN={Files:['up','dn'],View:['reg','dis','asm','P','X','I','gr'],Run:['run','step','go','halt','rst'],'External I/F Commands':['cmd'],Window:['cls'],Help:['help']};
const mb=$('#mb');mb.innerHTML=Object.keys(MN).map(k=>`<span>${k}</span>`).join('');
const closeM=()=>{mb.querySelectorAll('.dd').forEach(d=>d.remove());mb.querySelectorAll('.on').forEach(s=>s.classList.remove('on'))};
mb.onclick=ev=>{const s=ev.target.closest('span');if(!s)return;const was=s.classList.contains('on');closeM();if(was)return;s.classList.add('on');
const d=document.createElement('div');d.className='dd';d.style.left=s.offsetLeft+'px';d.innerHTML=MN[s.textContent].map(k=>`<div data-k="${k}">${ACT[k][0]}</div>`).join('');mb.append(d);
d.onclick=e2=>{const i=e2.target.closest('[data-k]');closeM();if(i)ACT[i.dataset.k][1]()}};
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#mb'))closeM()});
</script></body></html>
